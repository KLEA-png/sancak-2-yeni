    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#1a237e",
                light: "#3949ab",
                dark: "#0d1642",
              },
              accent: {
                DEFAULT: "#ff6b35",
                light: "#ff8a65",
              },
              secondary: {
                DEFAULT: "#4fc3f7",
                light: "#81d4fa",
              },
              surface: "#ffffff",
              background: "#f5f5f7",
              whatsapp: {
                green: "#25D366",

                bg: "#E5DDD5",
              },
              chat: {
                student: "#DCF8C6",
                teacher: "#FFFFFF",
                system: "#FFF3CD",
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Poppins', 'sans-serif'],
            },
            animation: {
              'blob': 'blob 7s infinite',
              'bounce-slow': 'bounce 3s infinite',
              'page-flip': 'pageFlip 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) forwards',
              'logo-pulse': 'logoPulse 1.5s infinite ease-in-out',
              'progress-load': 'progressLoad 2.2s linear forwards',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              pageFlip: {
                '0%': { transform: 'perspective(2000px) rotateY(0deg)', transformOrigin: 'left', zIndex: 100 },
                '100%': { transform: 'perspective(2000px) rotateY(-180deg)', transformOrigin: 'left', zIndex: -1, opacity: 0 }
              },
              logoPulse: {
                '0%, 100%': { transform: 'scale(1)', opacity: 0.9 },
                '50%': { transform: 'scale(1.03)', opacity: 1 }
              },
              progressLoad: {
                '0%': { width: '0%' },
                '100%': { width: '100%' }
              }
            }
          }
        }
      }
    </script>
